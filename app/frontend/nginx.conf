# ==============================================================================
# NGINX Configuration for React Frontend (Unprivileged Non-Root)
# ==============================================================================
# Purpose:
#   Serves the compiled React/Vite SPA static assets on unprivileged port 8080,
#   handles HTML5 pushState client routing fallback, provides /healthz probe,
#   and reverse-proxies /api/ requests to the backend service.
# ==============================================================================

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for high frontend performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Client Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy /api/ requests to the FastAPI backend service
    # (Used in local Docker Compose environments)
    # Using a variable ($backend_upstream) prevents NGINX from failing at startup
    # when 'backend' DNS is not resolvable in Kubernetes.
    location /api/ {
        resolver 127.0.0.11 10.96.0.10 valid=30s ipv6=off;
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Native Health Probe endpoint for Kubernetes and container health checks
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
