{{/*
==============================================================================
secret.yaml – Database credentials Secret
==============================================================================
Why: The Postgres password must be available before any other workload starts.
     We generate a random 24-char password using randAlphaNum on FIRST install,
     then reuse the existing password on every subsequent Argo CD sync via the
     Helm lookup() function – preventing the backend from losing its DB connection
     every time Argo CD reconciles. This is the standard pattern for secrets in
     Helm-managed GitOps flows where external secret managers are out of scope.
==============================================================================
*/}}

{{- $secretName := printf "%s-db-secret" (include "preview-app.fullname" .) }}

{{/*
  Argo CD renders manifests offline using `helm template` (no cluster access),
  so lookup returns empty and randAlphaNum would re-generate on every sync.
  We derive a deterministic, stable password per PR from prNumber + passwordSalt.
*/}}
{{- $dbPassword := printf "%s-%s" .Values.prNumber .Values.postgres.passwordSalt | sha256sum | trunc 24 }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from showing the password in `helm get values` output
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Raw password (Kubernetes base64-encodes stringData automatically)
  DB_PASSWORD: {{ $dbPassword | quote }}
  # Pre-built DATABASE_URL for the backend – avoids constructing it in the Deployment
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s-postgres:5432/%s"
    .Values.postgres.user
    $dbPassword
    (include "preview-app.fullname" .)
    .Values.postgres.db | quote }}
