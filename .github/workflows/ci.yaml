name: CI Pipeline (Lint, Test, Scan, Build & Push)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  packages: write # Required for pushing images to GHCR
  security-events: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/nitishhansa1/preview-env-platform-backend
  FRONTEND_IMAGE: ghcr.io/nitishhansa1/preview-env-platform-frontend

jobs:
  # Job 1: Test and Lint Backend
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Run Backend Tests
        run: |
          pytest app/backend/tests

  # Job 2: Test and Lint Frontend
  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: app/frontend/package.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build check
        working-directory: app/frontend
        run: npm run build

  # Job 3: Build, Scan with Trivy, and Push to GHCR
  build-and-push:
    name: Build & Push Ephemeral Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:pr-${{ github.event.pull_request.number }}
          load: true

      # Trivy Security Scan on Backend Image
      - name: Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:pr-${{ github.event.pull_request.number }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Push Backend Image to GHCR
      - name: Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:pr-${{ github.event.pull_request.number }}

      # Build & Push Frontend Image to GHCR
      - name: Build & Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:pr-${{ github.event.pull_request.number }}
