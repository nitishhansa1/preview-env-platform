name: Comment Preview Environment URL

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  comment-preview-url:
    name: Post Ephemeral Preview Link
    runs-on: ubuntu-latest
    steps:
      - name: Comment Preview Environment Link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.sha.substring(0, 7);
            const domainSuffix = process.env.DOMAIN_SUFFIX || '127.0.0.1.nip.io';
            const previewUrl = `http://pr-${prNumber}.${domainSuffix}`;

            const commentBody = `### 🚀 Preview Environment Ready!

            | Property | Details |
            |---|---|
            | **Preview URL** | [${previewUrl}](${previewUrl}) |
            | **Namespace** | \`pr-${prNumber}\` |
            | **Commit** | \`${commitSha}\` |
            | **Status** | 🟢 Provisioned via Argo CD |

            *This environment is automatically destroyed when this pull request is merged or closed.*`;

            // Search for existing preview bot comment to update in-place or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Preview Environment Ready!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
